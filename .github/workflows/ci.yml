name: Qualità

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Gazzetta Engine
        uses: actions/checkout@v4
        with:
          path: neveran-gazzetta-engine
      - name: Checkout retrieval condiviso
        uses: actions/checkout@v4
        with:
          repository: WineOfHub/neveran-knowledge-engine
          path: neveran-knowledge-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa dipendenze
        working-directory: neveran-gazzetta-engine
        run: |
          python -m pip install -e ../neveran-knowledge-engine
          python -m pip install -e ".[dev,api]"
      - name: Scansione segreti
        working-directory: neveran-gazzetta-engine
        run: python scripts/check_no_secrets.py
      - name: Test offline
        working-directory: neveran-gazzetta-engine
        env:
          ENVIRONMENT: test
        run: python -m pytest --cov --cov-report=term-missing
      - name: Lint
        working-directory: neveran-gazzetta-engine
        run: python -m ruff check .
      - name: Typing
        working-directory: neveran-gazzetta-engine
        run: python -m mypy src
      - name: Verifica drift JSON Schema
        working-directory: neveran-gazzetta-engine
        run: |
          python scripts/export_schemas.py
          git diff --exit-code -- prompts/schemas
      - name: Costruisci wheel e sdist
        working-directory: neveran-gazzetta-engine
        run: python -m build
